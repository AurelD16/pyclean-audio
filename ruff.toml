# Lint only: the code is not auto-formatted (`ruff format` would rewrite the
# whole historical diff; `ruff check` is what counts).
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
  "E501",    # line length is handled case by case, not automatically
  "B008",    # FastAPI: calls in default values (File(...), Form(...))
]

[lint.per-file-ignores]
"tests/*" = ["E402"]

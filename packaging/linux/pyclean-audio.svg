<?xml version="1.0" encoding="UTF-8"?>
<!-- pyclean-audio — application icon.
     Deliberately plain: a rounded square in the project's own colours with a
     symmetric waveform. No logo, no wordmark, nothing that pretends to be a
     brand. `packaging/linux/make-appimage.sh` uses this file directly, or
     converts it to a PNG when appimagetool needs a raster one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="pyclean-audio">
  <title>pyclean-audio</title>
  <rect x="4" y="4" width="248" height="248" rx="52" fill="#0e1116"/>
  <rect x="4.5" y="4.5" width="247" height="247" rx="51.5" fill="none"
        stroke="#2a3342" stroke-width="1"/>
  <!-- the waveform: bars of equal rhythm, the middle ones tallest, so the mark
       reads as "audio" at 32 px and as "restored audio" at 256 px -->
  <g fill="#f97316">
    <rect x="44"  y="112" width="12" height="32"  rx="6"/>
    <rect x="66"  y="92"  width="12" height="72"  rx="6"/>
    <rect x="88"  y="64"  width="12" height="128" rx="6"/>
    <rect x="110" y="40"  width="12" height="176" rx="6"/>
    <rect x="132" y="64"  width="12" height="128" rx="6"/>
    <rect x="154" y="92"  width="12" height="72"  rx="6"/>
    <rect x="176" y="112" width="12" height="32"  rx="6"/>
  </g>
  <!-- the two halves: what the page shows, source above, cleaned below -->
  <g fill="#fb923c" opacity="0.55">
    <rect x="110" y="150" width="12" height="24" rx="6"/>
    <rect x="132" y="142" width="12" height="40" rx="6"/>
  </g>
</svg>

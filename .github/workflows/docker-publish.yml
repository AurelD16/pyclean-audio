name: docker-publish

# Rebuilds and republishes the two supported images on demand:
#   * manually, for one variant (Actions → this workflow → Run workflow);
#   * automatically when a `docker-v*` tag is pushed (e.g. docker-v1, docker-v2).
#
# Only two tags exist: `:cpu` and `:gpu`, both public. No `:latest`: a floating
# tag on a self-hosted tool is a support problem, and these images are versioned
# by content digest instead.
#
# No secret to configure: GITHUB_TOKEN is enough for the repository's own
# packages. The images are big (the GPU one carries CUDA torch), so the build
# cache is kept per variant with mode=min to stay inside a standard runner's
# disk budget.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build and push (a dispatch publishes one; a tag publishes both)"
        type: choice
        required: true
        default: cpu
        options: [cpu, gpu]
  push:
    tags:
      - "docker-v*"

# Least privilege: read the repository, write its packages, nothing else.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Serialised per variant, not per ref: a workflow_dispatch runs on a branch
    # and a docker-v* push on a tag, so a ref-keyed group would let both push
    # :cpu at the same time. Keying on the variant is what actually protects the
    # tag — two :cpu legs queue (the newest cancels the older one), while :cpu
    # and :gpu keep running in parallel.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.variant }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch publishes the chosen variant only; a tag push
        # publishes both (inputs.variant is empty on a push event).
        variant: ${{ fromJSON(inputs.variant && format('["{0}"]', inputs.variant) || '["cpu","gpu"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          # The target *is* the variant: --target gpu builds CUDA torch, and a
          # tag can never disagree with what is inside it.
          target: ${{ matrix.variant }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.variant }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=min

      - name: Warn if the package is not publicly pullable yet
        # A ghcr package is private by default, so a successful push can still
        # leave an image nobody can pull without a token. GITHUB_TOKEN cannot
        # change package visibility (that is an account-level permission), so
        # this step only reports it: drop the runner's credentials, then ask the
        # registry for the manifest anonymously. A failure here is a warning,
        # not a failed build — flip visibility once, by hand, from the package
        # page or with a PAT that carries write:packages.
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ matrix.variant }}
        run: |
          docker logout ghcr.io 2>/dev/null || true
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE is publicly pullable."
          else
            echo "::warning::$IMAGE is not publicly pullable: a ghcr package is private until its visibility is set to public (Settings → Package settings)."
          fi